[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 -L defmt"
rustflags = [
  # GNU LD
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-nostartfiles",
]

[env]
ESP_LOG="info"
ESPFLASH_PORT = "/dev/cu.usbmodem12301"
DEFMT_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
