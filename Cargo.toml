[package]
edition      = "2024"
name         = "m5-minimal"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "m5-minimal"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s3", "defmt", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "defmt",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3", "defmt"] }
defmt                = "1.0.1"
defmt-rtt            = "1.1.0"
esp-backtrace       = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }

embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time     = { version = "0.5.0", features = ["defmt"] }
embassy-sync     = { version = "0.6.0", features = ["defmt"] }
esp-alloc        = "0.9.0"
esp-println      = { version = "0.16.1", features = ["esp32s3"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
mipidsi          = "0.9.0"
embedded-graphics = "0.8.1"
embedded-layout = "0.4"
embedded-hal-bus = "0.3.0"
embedded-hal = "1.0.0"
display-interface-spi = "0.5.0"
axp2101 = { git = "https://github.com/georgik/axp2101-rs.git", tag = "v0.2.0" }
embedded-hal-async = "1.0.0"
heapless = "0.8.0"
embassy-futures = "0.1.2"
micromath = "2.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
